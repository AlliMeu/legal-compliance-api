name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

  docker-e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the real stack (app + Mongo, no mocks)
        run: docker compose up -d --build

      - name: Wait for the app to answer over HTTP
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/cases/ping; then
              echo "App responded after $i tries - ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "App never responded after 60s."
              exit 1
            fi
            sleep 2
          done

      - name: Check real responses through real security and real Mongo
        run: |
          check() {
            expected=$1; shift
            status=$(curl -s -o /dev/null -w "%{http_code}" "$@")
            echo "$expected expected, got $status: $*"
            [ "$status" = "$expected" ]
          }
          url=http://localhost:8080
          check 404 -u paralegal:demo $url/cases/DOES-NOT-EXIST
          check 404 -u lawyer:demo -H 'Content-Type: application/json' \
            -d '{"category":"document.view","channel":"PORTAL"}' $url/cases/DOES-NOT-EXIST/access
          check 403 -u paralegal:demo -H 'Content-Type: application/json' \
            -d '{"category":"document.view","channel":"PORTAL"}' $url/cases/DOES-NOT-EXIST/access
          check 401 -u lawyer:wrong $url/cases/DOES-NOT-EXIST
          check 405 -u lawyer:demo -X PUT $url/cases/DOES-NOT-EXIST

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down
